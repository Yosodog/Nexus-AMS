name: Publish Nexus Core release

on:
  push:
    tags:
      - 'v*'
  # Called by cut-release.yml, whose GITHUB_TOKEN tag push triggers nothing.
  workflow_call:
    inputs:
      tag:
        description: 'Existing v* tag to build and publish'
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts
          cp .env.testing.example .env.testing
      - name: Test
        run: composer test:fast
      - name: Build production artifact
        run: bash scripts/build-release.sh "${RELEASE_TAG}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "${RELEASE_TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${RELEASE_TAG}" dist/nexus-core.tar.gz dist/nexus-release.json \
            --verify-tag --generate-notes --title "Nexus Core ${RELEASE_TAG}" "${prerelease[@]}"
