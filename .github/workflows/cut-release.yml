# One-click release: works out the next v* tag, checks its compatibility
# requirements, pushes the tag, and runs release.yml to build
# and publish. Run it from Actions > Release, or:
#
#   gh workflow run cut-release.yml --ref main -f bump=minor -f beta=true
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so release.yml
# is called directly. If publishing fails after the tag is pushed, re-run the
# failed jobs of this run; the tag is reused.
#
# To copy this to another Nexus repository, change only the env block below.
# release.yml there needs the same workflow_call trigger with a tag input, and
# scripts/release-version.mjs plus its test must be copied alongside.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor, or major bump from the newest tag on this branch; promote the newest prerelease; or explicit (set version)'
        type: choice
        options:
          - patch
          - minor
          - major
          - promote
          - explicit
        default: patch
      beta:
        description: 'Publish a -beta.N prerelease (beta channel only)'
        type: boolean
        default: false
      version:
        description: 'Exact tag such as v1.0.0, only with bump=explicit'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Compute and validate only; do not tag or publish'
        type: boolean
        default: true

env:
  # Component name written into nexus-release.json.
  COMPONENT: nexus-core
  # Compatibility requirements checked before tagging; empty when the
  # repository publishes no requirements (Nexus-Setup).
  REQUIRES_FILE: nexus-release.requires.json
  # Where each component's releases are published.
  COMPONENT_REPOS: >-
    {"nexus-updater": "Yosodog/Nexus-Setup",
     "nexus-core": "Yosodog/Nexus-AMS",
     "nexus-subs": "Yosodog/Nexus-AMS-Subs",
     "nexus-discord": "Yosodog/Nexus-AMS-Discord"}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main or a release branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF}" != refs/heads/main && "${REF}" != refs/heads/release/* ]]; then
            echo "::error::Releases run from main or release/*, not ${REF}"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test the version rules
        run: node --test scripts/release-version.test.mjs

      - name: Compute the release tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          BETA: ${{ inputs.beta }}
          VERSION: ${{ inputs.version }}
        run: |
          result=$(node scripts/release-version.mjs "${BUMP}" "${BETA}" "${VERSION}" "${GITHUB_SHA}")
          echo "${result}"
          echo "${result}" >> "${GITHUB_OUTPUT}"

      - name: Validate compatibility requirements
        if: env.REQUIRES_FILE != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          requires="${RUNNER_TEMP}/requires.json"
          git show "${SHA}:${REQUIRES_FILE}" > "${requires}" 2>/dev/null || echo '{}' > "${requires}"
          # Shape and the stable-must-not-require-prerelease rule, from this branch's script.
          node scripts/release-manifest.mjs "${COMPONENT}" "${TAG}" "${requires}" > /dev/null
          failed=0
          while read -r name minimum; do
            repo=$(jq -r --arg name "${name}" '.[$name] // empty' <<< "${COMPONENT_REPOS}")
            if [[ -z "${repo}" ]]; then
              echo "::error::No repository is mapped for ${name}"
              failed=1
              continue
            fi
            if draft=$(gh api "repos/${repo}/releases/tags/${minimum}" --jq '.draft' 2>/dev/null) && [[ "${draft}" == false ]]; then
              echo "${name} ${minimum}: published in ${repo}"
            else
              echo "::error::${name} requires ${minimum}, which is not a published release in ${repo}"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value)"' "${requires}")
          exit "${failed}"

      - name: Summarize
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          PROMOTE_FROM: ${{ steps.version.outputs.promote_from }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            if [[ "${DRY_RUN}" == true ]]; then
              echo "## ${TAG} (dry run, not tagged)"
            else
              echo "## ${TAG}"
            fi
            echo
            echo "Commit \`${SHA}\`${PROMOTE_FROM:+, promoted from ${PROMOTE_FROM}}"
            echo
            if [[ -n "${PREVIOUS}" ]]; then
              echo "### Commits since ${PREVIOUS}"
              range="${PREVIOUS}..${SHA}"
            else
              echo "### Commits"
              range="${SHA}"
            fi
            echo
            git log --no-merges --max-count=200 --format='- %s (%h)' "${range}"
          } >> "${GITHUB_STEP_SUMMARY}"

  tag:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Push the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
            # A re-run after a failed publish reuses the tag it already pushed.
            if [[ "${existing}" != "${SHA}" ]]; then
              echo "::error::${TAG} already points at ${existing}, not ${SHA}"
              exit 1
            fi
            echo "${TAG} already points at ${SHA}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}" > /dev/null
            echo "Pushed ${TAG} at ${SHA}"
          fi

  publish:
    needs: [prepare, tag]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
